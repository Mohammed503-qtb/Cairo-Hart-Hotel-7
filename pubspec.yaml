name: hotel_platform
description: "Lumière Grand Hotel — integrated hotel platform (public booking site, guest app, reception/PMS, admin) built with Flutter for Web, Android, iOS, macOS, Windows and Linux."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.0
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
