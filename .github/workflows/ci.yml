name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Analyze project (treat warnings as info — fail only on errors)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests (if any)
        run: flutter test --coverage || true

      - name: Upload coverage
        if: hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build-web-smoke:
    name: Web build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Web release build smoke test
        run: flutter build web --release --base-href "/"
      - uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: build/web
          retention-days: 3
