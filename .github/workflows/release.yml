name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ WEB ----
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web (release, GitHub Pages base-href)
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
          touch build/web/.nojekyll
      - name: Archive web build
        run: |
          cd build/web && zip -r "$RUNNER_TEMP/web-release.zip" . -x "*.DS_Store"
      - name: Compute SHA-256
        run: |
          cd "$RUNNER_TEMP" && sha256sum web-release.zip | tee web-release.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: |
            ${{ runner.temp }}/web-release.zip
            ${{ runner.temp }}/web-release.zip.sha256
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # --------------------------------------------------------------- ANDROID ----
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Decode signing keystore (if provided)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "Keystore decoded."
            cat > android/key.properties <<KC
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          KC
          else
            echo "No keystore secret — building with debug signing."
          fi

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Compute SHA-256
        run: |
          cd build/app/outputs/flutter-apk && sha256sum *.apk > "$RUNNER_TEMP/apk.sha256"
          cd build/app/outputs/flutter-bundle && sha256sum *.aab > "$RUNNER_TEMP/aab.sha256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-bundle/*.aab
            ${{ runner.temp }}/apk.sha256
            ${{ runner.temp }}/aab.sha256
          retention-days: 14

  # ------------------------------------------------------------------- iOS ----
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: flutter pub get

      - name: Build iOS (no-codesign — produces .app for archiving)
        run: flutter build ios --release --no-codesign

      - name: Archive unsigned .app into zip (for sideloading/manual signing)
        run: |
          # Package the built .app into a zip for distribution as an unsigned artifact.
          APP_DIR=$(find build/ios -name "Runner.app" -type d | head -1)
          if [ -n "$APP_DIR" ]; then
            cd "$(dirname "$APP_DIR")"
            zip -r "$RUNNER_TEMP/ios-unsigned.zip" Runner.app
            echo "Packaged unsigned .app"
          else
            echo "Runner.app not found — skipping archive"
          fi

      - name: Compute SHA-256
        run: |
          if [ -d build/ios/ipa ]; then
            cd build/ios/ipa && sha256sum *.ipa > "$RUNNER_TEMP/ipa.sha256" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: ${{ runner.temp }}/ios-unsigned.zip
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------- DESKTOP ------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake liblzma-dev
      - run: flutter pub get
      - name: Build Linux (release)
        run: flutter build linux --release
      - name: Archive Linux build
        run: |
          cd build/linux/x64/release/bundle && zip -r "$RUNNER_TEMP/linux-x64.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ runner.temp }}/linux-x64.zip
          retention-days: 14

  # -------------------------------------------------------------- RELEASE -----
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-android, build-ios, build-linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Stage release assets
        run: |
          set -e
          STAGE="$RUNNER_TEMP/release"
          mkdir -p "$STAGE"
          # Recursively find the actual artifact files (download-artifact@v4 may
          # nest files inside per-artifact subfolders, so direct globs miss them).
          find "$RUNNER_TEMP/artifacts" -type f \
            \( -name "*.apk" -o -name "*.aab" \
               -o -name "*.ipa" -o -name "ios-unsigned.zip" \
               -o -name "linux-x64.zip" -o -name "web-release.zip" \
               -o -name "web-release.zip.sha256" \
               -o -name "apk.sha256" -o -name "aab.sha256" -o -name "ipa.sha256" \) \
            -exec cp {} "$STAGE/" \;
          cd "$STAGE" && sha256sum * > checksums-all.sha256 2>/dev/null || true
          echo "=== Staged release assets ==="
          ls -la "$STAGE"
      - name: Extract changelog for this version
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v v="$VERSION" '
            BEGIN { insection=0 }
            /^## \[/ {
              if (insection==1) { exit }
              if (index($0, v)) { insection=1; next }
            }
            insection==1 { print }
          ' CHANGELOG.md > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            echo "Release $VERSION" > release_notes.md
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          files: |
            ${{ runner.temp }}/release/*
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
