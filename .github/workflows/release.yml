name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ WEB ----
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web (release, GitHub Pages base-href)
        run: flutter build web --release --base-href "${{ github.event.repository.name }}/" --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/
      - name: Add .nojekyll (so GitHub Pages serves _directories)
        run: touch build/web/.nojekyll
      - name: Archive web build
        run: |
          cd build/web && zip -r "$RUNNER_TEMP/web-release.zip" . -x "*.DS_Store"
      - name: Compute SHA-256
        id: sha
        run: |
          cd "$RUNNER_TEMP" && sha256sum web-release.zip | tee web-release.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: |
            ${{ runner.temp }}/web-release.zip
            ${{ runner.temp }}/web-release.zip.sha256
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Output artifact path
        run: echo "Web build ready at ${{ runner.temp }}/web-release.zip"

  # --------------------------------------------------------------- ANDROID ----
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Decode signing keystore (if provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          echo "Keystore decoded to $KEYSTORE_FILE"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Create key.properties (if keystore present)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties <<KC
          storeFile=$KEYSTORE_FILE
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          KC

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Compute SHA-256 for all artifacts
        run: |
          cd build/app/outputs/flutter-apk && sha256sum *.apk > "$RUNNER_TEMP/apk.sha256"
          cd "$RUNNER_TEMP" && sha256sum build/app/outputs/flutter-bundle/*.aab > "$RUNNER_TEMP/aab.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-bundle/*.aab
            ${{ runner.temp }}/apk.sha256
            ${{ runner.temp }}/aab.sha256
          retention-days: 14

  # ------------------------------------------------------------------- iOS ----
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: flutter pub get

      - name: Import iOS signing certificate (if provided)
        if: ${{ secrets.IOS_P12_BASE64 != '' }}
        uses: apple-actions/import-codesign-certificate@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install provisioning profile (if provided)
        if: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/Runner.mobileprovision

      - name: Build iOS (no-codesign fallback if no secrets)
        run: flutter build ios --release --no-codesign

      - name: Create IPA (signed) if secrets present
        if: ${{ secrets.IOS_P12_BASE64 != '' }}
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist || true

      - name: Compute SHA-256
        run: |
          if [ -d build/ios/ipa ]; then
            cd build/ios/ipa && sha256sum *.ipa > "$RUNNER_TEMP/ipa.sha256" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            build/ios/ipa/*.ipa
            ${{ runner.temp }}/ipa.sha256
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------- DESKTOP ------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake liblzma-dev
      - run: flutter pub get
      - name: Build Linux (release)
        run: flutter build linux --release
      - name: Archive Linux build
        run: |
          cd build/linux/x64/release/bundle && zip -r "$RUNNER_TEMP/linux-x64.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ runner.temp }}/linux-x64.zip
          retention-days: 14

  # -------------------------------------------------------------- RELEASE -----
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-android, build-ios, build-linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Stage release assets
        run: |
          set -e
          STAGE="$RUNNER_TEMP/release"
          mkdir -p "$STAGE"
          # Web
          cp "$RUNNER_TEMP"/artifacts/web-release/web-release.zip "$STAGE/" || true
          cp "$RUNNER_TEMP"/artifacts/web-release/web-release.zip.sha256 "$STAGE/" || true
          # Android
          cp "$RUNNER_TEMP"/artifacts/android-release/*.apk "$STAGE/" || true
          cp "$RUNNER_TEMP"/artifacts/android-release/*.aab "$STAGE/" || true
          cp "$RUNNER_TEMP"/artifacts/android-release/apk.sha256 "$STAGE/" || true
          cp "$RUNNER_TEMP"/artifacts/android-release/aab.sha256 "$STAGE/" || true
          # iOS
          cp "$RUNNER_TEMP"/artifacts/ios-release/*.ipa "$STAGE/" || true
          cp "$RUNNER_TEMP"/artifacts/ios-release/ipa.sha256 "$STAGE/" || true
          # Linux
          cp "$RUNNER_TEMP"/artifacts/linux-x64/linux-x64.zip "$STAGE/" || true
          # Compute combined checksums
          cd "$STAGE" && sha256sum * > ../checksums.sha256
          mv "$RUNNER_TEMP/checksums.sha256" "$STAGE/checksums-all.sha256"
          ls -la "$STAGE"

      - name: Extract changelog for this version
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Extract the section between this version and the previous one
          awk -v v="$VERSION" '
            BEGIN { insection=0 }
            /^## \[/ {
              if (insection==1) { exit }
              if (index($0, v)) { insection=1; next }
            }
            insection==1 { print }
          ' CHANGELOG.md > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            echo "Release $VERSION" > release_notes.md
          fi
          echo "path=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ runner.temp }}/release/*
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
